[project]
name = "trace-api"
version = "0.1.0"
description = "Automated penetration testing system for API-related CVEs using LLMs and AI agents"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "litellm>=1.40.0",
    "structlog>=24.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "networkx>=3.0",
    "jinja2>=3.1",
    "json-repair>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.scripts]
trace-api = "src.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
